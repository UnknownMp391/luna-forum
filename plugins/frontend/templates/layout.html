<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Luna Forum">
<html lang="zh-cn">

<head>
    <title>{% block title %}{{ site.name }} - {{ pagename }}{% endblock %}</title>
    <script src="/static/fluentui/web-components.min.js"></script>
    <script src="/static/sidebar.js"></script>
    <script src="/static/fluent-icon/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/static/sidebar.css">
    <link rel="stylesheet" href="/static/lfstyle-v1.css">
    <script> document.addEventListener('DOMContentLoaded', () => { callDrawerAfterLoading("{{ pagename }}"); }); </script>
</head>

<body>
    <aside class="sidebar" data-lf-drawer-target="lf-sidebar">
        <div class="header">
            <div class="logo"><span class="logo-text">{{ title }}</span></div>
            <button class="toggle" data-lf-drawer-toggle="lf-sidebar">
                <span>
                    <iconify-icon icon="fluent:ios-arrow-ltr-24-regular"></i>
                </span>
            </button>
        </div>
        <nav class="nav">
            <div class="nav-item" data-title="Dev Layout Preview">
                <span><iconify-icon icon="fluent:home-24-regular"></iconify-icon></span>
                <span class="nav-label">Dev Layout Preview</span>
            </div>
        </nav>
        <div class="footer">
            <div class="user">
                <fluent-avatar data-color="neutral" class="avatar"></fluent-avatar>
                <div class="user-info">
                    {% if user %}
                    <div class="user-name">{{ user.username }}</div>
                    {% else %}
                    <div class="user-name"><fluent-link href="/login" tabindex="0">登录</fluent-link></div>
                    {% endif %}
                </div>
            </div>
            <fluent-avatar data-color="neutral" class="mini-avatar"></fluent-avatar>
        </div>
    </aside>
    <!--main area-->
    <main class="content-area">
        <header class="topbar">
            <button class="menu-toggle" data-lf-drawer-menu="lf-sidebar"></button>
            <h1 class="title" data-lf-drawer-title>{{ pagename }}</h1>
        </header>
        <div class="content">
            {% block page_content %}{% endblock %}
        </div>
    </main>
    <div class="overlay" data-lf-drawer-overlay></div>
</body>

</html>
