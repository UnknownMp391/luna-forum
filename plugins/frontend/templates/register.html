{% extends "layout.html" %}
{% block ext_script %}{% endblock %}
{% block page_content %}
<div class="lf-card-center-wrapper">
    <div class="lf-card lf-card-center">
        {% if error %}
        <div class="lf-error-message">
            <div class="lf-card-header">
                <div class="lf-card-title"><iconify-icon icon="fluent:error-circle-48-filled"></iconify-icon>Oops!</div>
                <div class="lf-card-subtitle">出错了</div>
            </div>
            <div class="lf-card-content">
                <p><strong>错误：{{ error }}。</strong></p>
                <p><strong>解决方案：</strong>请<fluent-link onclick="location.reload()" href="#">刷新页面（点此刷新）</fluent-link>后重试。
                </p>
            </div>
        </div>
        {% else %}
        <div class="lf-card-header">
            <div class="lf-card-title">在 {{ site.name }} 上注册</div>
            <div class="lf-card-subtitle">欢迎您加入 {{ site.name }}！已有帐户？<fluent-link href="/login">立即登录！</fluent-link>
            </div>
        </div>
        <div class="lf-card-content">
            <form method="POST" action="/api/v1/register" class="lf-form">
                <fluent-text-input type="email" name="email" class="lf-card-input" autofocus required>
                    <fluent-label weight="regular" size="medium" required>电子邮件</fluent-label>
                </fluent-text-input>
                <fluent-text-input type="text" name="username" class="lf-card-input" required>
                    <fluent-label weight="regular" size="medium" required>用户名</fluent-label>
                </fluent-text-input>
                <fluent-text-input type="password" name="password" class="lf-card-input" required>
                    <fluent-label weight="regular" size="medium" required>密码</fluent-label>
                </fluent-text-input>
                <fluent-field label-position="after">
                    <fluent-label slot="label" class="lf-agreement-link" required>我同意<fluent-link
                            href="#">用户协议</fluent-link>和<fluent-link href="#">隐私保护协议</fluent-link></fluent-label>
                    <fluent-checkbox slot="input" aria-required="true"
                        onchange="document.getElementById('lf-register-btn').disabled = !this.checked"></fluent-checkbox>
                </fluent-field>
                <fluent-button appearance="primary" type="submit" id="lf-register-btn" disabled>注册</fluent-button>
            </form>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
