{{- if not .Values.configExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "luna-forum.fullname" . }}-config
  labels:
    {{- include "luna-forum.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 应用优先读取 CONFIG 环境变量（JSON，结构与 config.json 一致）
  CONFIG: {{ include "luna-forum.configJson" . | quote }}
{{- end }}
